services:
  - type: web
    name: sgp-makala
    runtime: python
    plan: free
    repo: https://github.com/Graddy12/SGP_MAKALA
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health/
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash scripts/start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DEMO_MODE
        value: true
      - key: SGP_ADMIN_PASSWORD
        generateValue: true
