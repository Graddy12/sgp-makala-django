{% extends 'base.html' %}
{% block title %}Nouvel écrou — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm p-4 rounded-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-bold font-outfit mb-0">Nouvel Écrou</h1>
        <span class="badge bg-primary">Matricule prévu : {{ preview_matricule }}</span>
    </div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Nom *</label><input name="nom" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Postnom</label><input name="postnom" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Prénom *</label><input name="prenom" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Date naissance *</label><input type="date" name="date_naissance" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Lieu naissance *</label><input name="lieu_naissance" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">Genre</label><select name="genre" class="form-select"><option value="M">M</option><option value="F">F</option></select></div>
            <div class="col-md-2"><label class="form-label">État civil</label>
                <select name="etat_civil" class="form-select">
                    <option value="celibataire">Célibataire</option><option value="marie">Marié(e)</option>
                    <option value="divorce">Divorcé(e)</option><option value="veuf">Veuf/Veuve</option>
                </select>
            </div>
            <div class="col-md-4"><label class="form-label">Nationalité</label><input name="nationalite" class="form-control" value="Congolaise (RDC)"></div>
            <div class="col-md-8"><label class="form-label">Adresse</label><input name="adresse" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Statut judiciaire</label>
                <select name="statut_judiciaire" class="form-select">{% for v,l in StatutJudiciaire.choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-4"><label class="form-label">Dangerosité</label>
                <select name="niveau_dangerosite" class="form-select">{% for v,l in NiveauDangerosite.choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-4"><label class="form-label">Date écrou</label><input type="datetime-local" name="date_ecrou" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Cellule</label>
                <select name="cellule_id" class="form-select"><option value="">— Aucune —</option>
                {% for c in cellules %}<option value="{{ c.id }}">{{ c.code_cellule }} ({{ c.places_libres }} places)</option>{% endfor %}</select>
            </div>
            <div class="col-12"><label class="form-label">Motif d'inculpation *</label><textarea name="motif_inculpation" class="form-control" rows="3" required></textarea></div>
            <div class="col-md-6"><label class="form-label">Photo (JPG/PNG/WEBP ≤5Mo)</label><input type="file" name="photo" class="form-control" accept=".jpg,.jpeg,.png,.webp"></div>
            <div class="col-md-6"><label class="form-label">Document initial</label><input type="file" name="document_initial" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Titre document</label><input name="document_titre" class="form-control" value="Mandat de Dépôt"></div>
            <div class="col-md-6"><label class="form-label">Type document</label>
                <select name="document_type" class="form-select">{% for v,l in doc_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select>
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary">Enregistrer l'écrou</button>
            <a href="{% url 'prison:detenus' %}" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
