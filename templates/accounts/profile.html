{% extends 'base.html' %}
{% block title %}Mon profil — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="row g-4">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm p-4 rounded-4">
            <h1 class="h5 fw-bold mb-3">Identité</h1>
            <p class="mb-1"><strong>{{ user.full_name }}</strong></p>
            <p class="mb-1 text-muted">{{ user.email }}</p>
            <p class="mb-1"><span class="badge {{ user.role_badge }}">{{ user.role_label }}</span></p>
            <p class="mb-0 small text-muted">Matricule : {{ user.matricule }}</p>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card border-0 shadow-sm p-4 rounded-4">
            <h2 class="h5 fw-bold mb-3">Changer le mot de passe</h2>
            <form method="post" action="{% url 'accounts:profile_password' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Mot de passe actuel</label>
                    <input type="password" name="current_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nouveau mot de passe</label>
                    <input type="password" name="new_password" class="form-control" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmer</label>
                    <input type="password" name="new_password_confirm" class="form-control" minlength="8" required>
                </div>
                <button class="btn btn-primary">Mettre à jour</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
